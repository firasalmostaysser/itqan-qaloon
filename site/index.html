<head>

<title>الطريق إلى الإتقان</title>

<style>/* Layout: a single reading column (the mushaf page) framed like a Maghrebi manuscript; chrome stays quiet so the cheikh's six colours carry the meaning. */
:root {
  --paper: #F4EFE2;
  --page: #FBF8F1;
  --ink: #1F1B16;
  --muted: #6A6255;
  --line: #DED2B4;
  --zitouna: #0F4C3A;
  --zitouna-soft: #E3EDE6;
  --gold: #A88437;
  --on-accent: #FFFFFF;
  --danger: #B42318;
  --ok: #1E7B4C;
  --shadow: 0 10px 30px rgba(40, 32, 15, .14);
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-naskh: "Amiri", "Traditional Arabic", "Times New Roman", serif;
  --q: 34px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101614; --page: #151C1A; --ink: #EDE7D8; --muted: #A9A08F; --line: #2C3833;
    --zitouna: #6CC4A1; --zitouna-soft: #1C2B26; --gold: #C9A55A; --on-accent: #0D1311;
    --danger: #FF8A7A; --ok: #6CD69C; --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101614; --page: #151C1A; --ink: #EDE7D8; --muted: #A9A08F; --line: #2C3833;
  --zitouna: #6CC4A1; --zitouna-soft: #1C2B26; --gold: #C9A55A; --on-accent: #0D1311;
  --danger: #FF8A7A; --ok: #6CD69C; --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--zitouna); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)) 0; border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 21px; margin: 0; line-height: 1.2; color: var(--zitouna); }
.brand small { display: block; color: var(--muted); font-size: 11.5px; letter-spacing: .2px; }
.nav { display: flex; gap: 2px; margin-inline-start: auto; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.nav a { padding: 10px 12px 12px; text-decoration: none; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
.nav a[aria-current="page"] { color: var(--zitouna); border-bottom-color: var(--zitouna); }
.nav a.admin-link { color: var(--gold); }

main { max-width: 980px; margin: 0 auto; padding-top: 16px; }
.view[hidden] { display: none !important; }

/* Controls */
.bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.field { display: flex; align-items: center; gap: 6px; }
.field label { color: var(--muted); font-size: 13px; }
select, input[type="text"], input[type="number"], input[type="password"], textarea { background: var(--page); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--page); }
.seg button { border: 0; background: none; padding: 6px 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--zitouna); color: var(--on-accent); }
.btn { border: 1px solid var(--line); background: var(--page); border-radius: 8px; padding: 7px 12px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn:hover { border-color: var(--gold); }
.btn.primary { background: var(--zitouna); color: var(--on-accent); border-color: var(--zitouna); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }
.iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--page); display: inline-grid; place-items: center; font-size: 17px; line-height: 1; }

/* Legend: the cheikh's colours */
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 0; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topH, 60px)); z-index: 4; background: var(--paper); }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--page); border-radius: 999px; padding: 4px 11px 4px 9px; font-size: 13.5px; }
.chip .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--dot); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.chip[aria-pressed="false"] { opacity: .45; }
.chip[aria-pressed="false"] .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--dot); }
.chip.small { font-size: 12.5px; padding: 2px 9px 2px 7px; }
.legend .sep { flex: 1; }
.legend-all { display: inline-flex; gap: 2px; white-space: nowrap; }
@media (max-width: 700px) {
  .legend { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  .legend::-webkit-scrollbar { display: none; }
  .legend .chip { flex: none; }
  .legend .sep { display: none; }
}
.linkbtn { border: 0; background: none; color: var(--zitouna); padding: 4px 6px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

/* Mushaf page */
.page { position: relative; background: var(--page); border-radius: 6px; padding: 26px clamp(14px, 4vw, 44px) 36px; box-shadow: var(--shadow); }
.page::before { content: ""; position: absolute; inset: 7px; border: 1.5px solid var(--gold); border-radius: 3px; pointer-events: none; }
.page::after { content: ""; position: absolute; inset: 11px; border: .5px solid var(--gold); border-radius: 2px; pointer-events: none; opacity: .7; }
.cartouche { position: relative; margin: 4px auto 14px; max-width: 420px; text-align: center; padding: 8px 18px; border: 1.5px solid var(--gold); border-radius: 40px; background: var(--zitouna-soft); }
.cartouche h2 { font-family: var(--f-display); font-weight: 500; margin: 0; font-size: 22px; color: var(--zitouna); }
.cartouche span { color: var(--muted); font-size: 12.5px; }
.basmala { text-align: center; font-size: calc(var(--q) * .92); margin-bottom: 6px; }
.mushaf { font-size: var(--q); text-align: justify; text-align-last: center; direction: rtl; line-height: 1; word-spacing: .05em; }
.w, .ae { display: inline-block; border: 0; background: none; padding: 0; margin: -.2em 0; vertical-align: top; border-radius: 6px; color: inherit; line-height: 0; }
.w { cursor: pointer; }
.w:hover { background: color-mix(in srgb, var(--gold) 14%, transparent); }
.w.sel { background: color-mix(in srgb, var(--gold) 26%, transparent); }
.w.cur { background: color-mix(in srgb, var(--zitouna) 22%, transparent); }
.ae { cursor: pointer; }
.qw { display: block; overflow: visible; }
.qw use { fill: var(--ink); }
.k-__hide { opacity: 0; }
.more { text-align: center; margin-top: 18px; color: var(--muted); }
.lesson-banner { border: 1px solid var(--gold); background: var(--page); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: grid; gap: 8px; }
.lesson-banner h3 { margin: 0; font-family: var(--f-display); font-weight: 500; color: var(--zitouna); font-size: 18px; }
.lesson-banner p { margin: 0; max-width: 70ch; }
.lesson-banner .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Sheets (word panel, ayah menu) */
.scrim { position: fixed; inset: 0; background: rgba(15, 12, 6, .35); z-index: 20; }
.sheet { position: fixed; z-index: 21; inset: auto 0 0 0; max-height: 88vh; overflow: auto; background: var(--page); border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
  padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 1000px) { .sheet { inset: 84px auto 16px 16px; width: 440px; border-radius: 14px; max-height: none; } .scrim.soft { background: transparent; pointer-events: none; } }
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.sheet-head h3 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 500; flex: 1; }
.bigword { display: flex; justify-content: center; font-size: clamp(64px, 18vw, 104px); padding: 6px 0 10px; }
.section { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; display: grid; gap: 10px; }
.section h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .2px; }
.units { display: grid; gap: 8px; }
.unit { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.unit .glyph { font-size: 46px; display: flex; justify-content: center; }
.unit ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; }
.unit li { display: flex; gap: 7px; align-items: baseline; }
.unit li .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--dot); transform: translateY(1px); }
.unit li b { font-weight: 600; }
.unit .role { color: var(--muted); font-size: 12.5px; }
.video-box { display: grid; gap: 8px; }
.video-box video { width: 100%; border-radius: 10px; background: #000; max-height: 46vh; }
.empty { color: var(--muted); font-size: 13.5px; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; }
.reps { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.reps .count { font-family: var(--f-display); font-size: 22px; min-width: 64px; text-align: center; color: var(--zitouna); font-variant-numeric: tabular-nums; }
.note { background: var(--zitouna-soft); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }

/* Fullscreen video with the coloured word */
.stage { position: fixed; inset: 0; z-index: 40; background: #0B0C0B; color: #F2EEE4; display: grid; grid-template-rows: auto 1fr auto; }
.stage-top { display: flex; gap: 8px; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.stage-top .title { flex: 1; color: #BDB6A6; font-size: 13px; }
.stage .iconbtn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #F2EEE4; }
.stage video { width: 100%; height: 100%; object-fit: contain; min-height: 0; }
.stage .novideo { display: grid; place-items: center; color: #8F887A; font-size: 14px; }
.stage-word { background: #F7F2E6; color: #1F1B16; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 6px; }
.stage-word .bigword { font-size: clamp(70px, 14vw, 150px); padding: 0; }
.stage-word .qw use { fill: #1F1B16; }
.stage-ctrl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.stage-ctrl .btn { background: #fff; color: #1F1B16; border-color: #DDD3BD; }
.stage .ayahline { font-size: clamp(26px, 5vw, 44px); text-align: center; direction: rtl; padding: 6px 0; line-height: 1; }

/* Cards / lists */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { background: var(--page); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.card h3 { margin: 0; font-family: var(--f-display); font-weight: 500; font-size: 18px; color: var(--zitouna); }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; }
.card .num { color: var(--gold); font-family: var(--f-display); font-size: 14px; }
.card.done { border-color: var(--ok); }
.card .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.page-title { font-family: var(--f-display); font-weight: 500; color: var(--zitouna); font-size: 26px; margin: 6px 0 4px; text-wrap: balance; }
.lead { color: var(--muted); max-width: 70ch; margin: 0 0 16px; }
.prose { max-width: 70ch; }
.prose p { margin: 0 0 12px; }
.prose h3 { font-family: var(--f-display); font-weight: 500; color: var(--zitouna); margin: 22px 0 8px; font-size: 19px; }
.prose blockquote { margin: 0 0 12px; padding: 10px 14px; border-inline-start: 3px solid var(--gold); background: var(--page); border-radius: 0 8px 8px 0; }
.colorkey { display: grid; gap: 8px; margin: 10px 0 20px; }
.colorkey div { display: grid; grid-template-columns: 18px 130px 1fr; gap: 10px; align-items: baseline; }
.colorkey .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--dot); transform: translateY(2px); }
@media (max-width: 520px) { .colorkey div { grid-template-columns: 18px 1fr; } .colorkey div span:last-child { grid-column: 2; color: var(--muted); } }

/* Practice table */
.ptable-wrap { overflow-x: auto; background: var(--page); border-radius: 10px; border: 1px solid var(--line); }
.ptable { border-collapse: collapse; width: 100%; min-width: 640px; }
.ptable th { font-family: var(--f-display); font-weight: 500; font-size: 15px; padding: 10px 8px; border-bottom: 1px solid var(--line); color: var(--hc); }
.ptable td { border-inline-start: 1px solid var(--line); vertical-align: top; padding: 6px; font-size: 26px; min-width: 100px; }
.ptable td:first-child { border-inline-start: 0; }
.ptable .cell { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 80px; }
.ptable .cell .w { margin: 0; }
.ptable td.target { cursor: pointer; }
.ptable td.target:hover { background: var(--zitouna-soft); }
.ptable .placed { position: relative; border-radius: 6px; }
.ptable .placed.right { box-shadow: 0 0 0 2px var(--ok); }
.ptable .placed.wrong { box-shadow: 0 0 0 2px var(--danger); }
.ayah-show { font-size: 32px; text-align: center; direction: rtl; line-height: 1; padding: 14px 8px; background: var(--page); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
.pool { display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: center; font-size: 30px; padding: 8px; }
.pool .w.picked { background: color-mix(in srgb, var(--zitouna) 25%, transparent); }
.result { padding: 10px 12px; border-radius: 10px; background: var(--zitouna-soft); }
.missing { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }

/* Admin */
.admin-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.admin-tabs button { border: 1px solid var(--line); background: var(--page); border-radius: 999px; padding: 6px 14px; }
.admin-tabs button[aria-pressed="true"] { background: var(--zitouna); color: var(--on-accent); border-color: var(--zitouna); }
.catrows { display: grid; gap: 8px; }
.catrow { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: center; background: var(--page); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.catrow .order { display: grid; gap: 2px; }
.catrow .order button { width: 28px; height: 22px; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; font-size: 11px; line-height: 1; }
.catrow .colors { display: flex; gap: 6px; align-items: center; }
.catrow input[type="color"] { width: 38px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; }
.catrow .meta { display: grid; gap: 6px; min-width: 0; }
.catrow .meta input { width: 100%; }
.catrow .flags { display: grid; gap: 4px; font-size: 13px; }
@media (max-width: 640px) { .catrow { grid-template-columns: auto 1fr; } .catrow .meta, .catrow .flags { grid-column: 1 / -1; } }
.preview { font-size: 30px; text-align: center; line-height: 1; padding: 12px; background: var(--page); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; direction: rtl; }
.savebar { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--page); border: 1px solid var(--gold); border-radius: 12px; padding: 10px 12px; margin-top: 16px; box-shadow: var(--shadow); }
.savebar .status { flex: 1; font-size: 13.5px; color: var(--muted); min-width: 180px; }
.slotbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 7px; background: var(--paper); font-size: 12.5px; }
.slotbtn .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dot, transparent); box-shadow: inset 0 0 0 1px var(--line); }
.slotbtn.ov { border-color: var(--gold); }
.slots { display: flex; flex-wrap: wrap; gap: 6px; }
.kv { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 10px 14px; align-items: center; }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; } }
.list { display: grid; gap: 6px; }
.list .item { display: flex; gap: 10px; align-items: center; background: var(--page); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
.list .item .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
.loading { display: grid; place-items: center; gap: 10px; min-height: 50vh; color: var(--muted); text-align: center; }
.loading .bar-l { width: 180px; height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; }
.loading .bar-l i { display: block; height: 100%; width: 40%; background: var(--zitouna); animation: slide 1.1s infinite ease-in-out; }
@keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(260%); } }
.foot { max-width: 980px; margin: 28px auto 0; color: var(--muted); font-size: 12.5px; text-align: center; display: grid; gap: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Recorder */
.recbtn { width: 72px; height: 72px; border-radius: 50%; border: 5px solid #fff; background: #D7263D; box-shadow: 0 0 0 2px #D7263D; cursor: pointer; }
.recbtn.on { border-radius: 18px; animation: pulse 1.2s infinite ease-in-out; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(215, 38, 61, .25); } }
.rec-timer { color: #FF6B6B; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; }
.stage video#rv { background: #000; }
#stageRoot:not(:empty) ~ .toast { bottom: auto; top: calc(64px + env(safe-area-inset-top, 0px)); }
</style>
<style id="catvars"></style>
</head>
<body>
<svg id="gdefs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<div dir="rtl" lang="ar">
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#mushaf">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--gold)"><rect x="9" y="9" width="22" height="22" rx="1"/><rect x="9" y="9" width="22" height="22" rx="1" transform="rotate(45 20 20)"/></g><circle cx="20" cy="20" r="5.5" fill="var(--zitouna)"/></svg>
        <span><h1>الطريق إلى الإتقان</h1><small>تلاوة برواية قالون · الشيخ المقرئ محمّد بن عبد الله جوّاد</small></span>

</div>
<script>/* Tajweed colour engine for «الطريق إلى الإتقان» — method of الشيخ المقرئ محمّد بن عبد الله جوّاد.
   Works on KFGQPC Qaloon text. Every rule returns {i: charIndex, cat, why} candidates; the page
   resolves them per character with the cheikh's priority order and the visible categories. */
(function (root) {
  "use strict";

  const CATEGORIES = [
    // The cheikh's six colours, in his order.
    { id: "shadid", name: "ساكن شديد", color: "#39B54A", dark: "#5ED36E", core: true, on: true, table: true,
      short: "سكون أو شدّة على حرف من (أجد قط بكت): ينحبس معه الصوت في المخرج." },
    { id: "bayni", name: "ساكن بيني", color: "#29ABE2", dark: "#5CC6F2", core: true, on: true, table: true,
      short: "سكون أو شدّة على حرف من (لن عمر): يجري معه الصوت جرياناً جزئياً." },
    { id: "rikhw", name: "ساكن رخو", color: "#ED1C24", dark: "#FF5C61", core: true, on: true, table: true,
      short: "سكون أو شدّة على باقي الحروف: يجري معها الصوت جرياناً كاملاً." },
    { id: "ghunna", name: "تمكين الغنة", color: "#EC008C", dark: "#FF4DB3", core: true, on: true, table: true,
      short: "الغنّة الكاملة: النون والميم المشدّدتان، والمدغم والمخفى والمقلب." },
    { id: "harakat", name: "إتمام الحركات", color: "#21409A", dark: "#86A2FF", core: true, on: true, table: true,
      short: "الفتحة والضمّة والكسرة تُتمّ ولا تُختلس: الفتحة بفتح الفم، والضمّة بضمّ الشفتين، والكسرة بخفض الفك." },
    { id: "takhlis", name: "تخليص الحروف", color: "#F7941D", dark: "#FFAE4D", core: true, on: true, table: true,
      short: "(خص ضغط قظ) والراء المفخّمة ولام لفظ الجلالة بعد فتح أو ضمّ: لا يؤثّر المفخّم في المرقّق ولا العكس." },
    // Extras the cheikh can switch on.
    { id: "idgham", name: "حرف مدغم لا يُنطق", color: "#B0B0B0", dark: "#6E6E6E", on: true,
      short: "حرف يُدغم في الذي بعده فلا يُنطق مستقلاً، مثل نون «مِن» قبل «مَّسَد»." },
    { id: "wasl", name: "ضبط همزة الوصل", color: "#0E7C66", dark: "#3CC9A8", on: false,
      short: "همزة الوصل وعلامة ضبطها: تسقط في الوصل وتثبت في الابتداء." },
    { id: "tashil", name: "التسهيل", color: "#8E44AD", dark: "#C08BE0", on: false,
      short: "تسهيل الهمزة الثانية بين الهمزة والألف (رواية قالون)." },
    { id: "ikhtilas", name: "الاختلاس والإشمام", color: "#7D5A3C", dark: "#C89B72", on: false,
      short: "مواضع الاختلاس والإشمام الخاصة برواية قالون." },
    { id: "madd_lazim", name: "مدّ لازم", color: "#B03A2E", dark: "#E07065", on: false, short: "مدّ بعده سكون أصلي: ستّ حركات." },
    { id: "madd_muttasil", name: "مدّ متّصل", color: "#C0392B", dark: "#E4776B", on: false, short: "حرف المدّ وبعده همز في كلمة واحدة." },
    { id: "madd_munfasil", name: "مدّ منفصل", color: "#D35400", dark: "#F08A45", on: false, short: "حرف المدّ آخر الكلمة والهمز أول التي بعدها." },
    { id: "madd_arid", name: "مدّ عارض للسكون", color: "#A04000", dark: "#D9773A", on: false, short: "حرف المدّ قبل الحرف الموقوف عليه." },
    { id: "madd_tabii", name: "مدّ طبيعي", color: "#16A085", dark: "#48D1B5", on: false, short: "الألف بعد فتح، والواو بعد ضمّ، والياء بعد كسر: حركتان." },
    { id: "madd_sila", name: "مدّ الصلة", color: "#2E86C1", dark: "#64B1E6", on: false, short: "صلة هاء الكناية (الواو والياء الصغيرتان)." },
    { id: "ghunna_naqisa", name: "غنّة ناقصة", color: "#F06EAA", dark: "#F59AC4", on: false, short: "النون والميم الساكنتان المظهرتان." },
    { id: "ghunna_anqas", name: "غنّة أنقص", color: "#F7B2D2", dark: "#F9C9DF", on: false, short: "النون والميم المتحرّكتان." },
    { id: "lam_shamsiya", name: "لام شمسية", color: "#95A5A6", dark: "#7F8C8D", on: false, short: "لام «ال» المدغمة في الحرف الشمسي بعدها." },
    { id: "zaid", name: "حرف زائد لا يُنطق", color: "#BDC3C7", dark: "#5D6D7E", on: false, short: "حرف يُكتب ولا يُنطق، مثل الألف بعد واو الجماعة." },
  ];

  const DEFAULT_ORDER = ["ghunna", "idgham", "shadid", "bayni", "rikhw", "takhlis", "harakat", "wasl", "tashil", "ikhtilas",
    "madd_lazim", "madd_muttasil", "madd_munfasil", "madd_arid", "madd_tabii", "madd_sila", "ghunna_naqisa", "ghunna_anqas",
    "lam_shamsiya", "zaid"];

  const SETTINGS = {
    mode: "waqf",            // waqf: وقف على رؤوس الآي | wasl | marks: وقف عند علامات الوقف
    finalHaraka: "keep",     // keep (إتمام الحركات) | sakin (لون الساكن) | hide
    tanweenAtWaqf: "harakat", // harakat: no ghunna at a stop (default) | keep: keep the ghunna colour
    classes: { shadid: "ءأإؤئجدقطبكت", bayni: "لنعمر", takhlis: "خصضغطقظ" },
  };

  const MT = {
    "َ": "fatha", "ُ": "damma", "ِ": "kasra", "ْ": "sukun", "ۡ": "sukun", "ّ": "shadda",
    "ً": "tanF", "ٌ": "tanD", "ٍ": "tanK", "ٗ": "otanF", "ٞ": "otanD", "ٖ": "otanK",
    "ࣰ": "otanF", "ࣱ": "otanD", "ࣲ": "otanK", "ۢ": "iqlab", "ۭ": "iqlab", "ٓ": "madd",
    "ٰ": "dagger", "ۥ": "swaw", "ۦ": "sya", "ۧ": "sya", "ۨ": "snoon", "۬": "dot",
    "۪": "dot2", "۟": "zero", "۠": "zero", "ٔ": "hamza", "ٕ": "hamza", "۩": "sajda",
    "‏": "ctrl", "ۖ": "waqf", "ۗ": "waqf", "ۘ": "waqf", "ۙ": "waqf", "ۚ": "waqf",
    "ۛ": "waqf", "ۜ": "waqf",
  };
  const VOW = { fatha: "a", damma: "u", kasra: "i", tanF: "a", tanD: "u", tanK: "i", otanF: "a", otanD: "u", otanK: "i" };
  const IKHFA = "تثجدذزسشصضطظفقك";
  const LETTER_NAME = { "ء": "الهمزة", "ب": "الباء", "ت": "التاء", "ث": "الثاء", "ج": "الجيم", "ح": "الحاء", "خ": "الخاء", "د": "الدال",
    "ذ": "الذال", "ر": "الراء", "ز": "الزاي", "س": "السين", "ش": "الشين", "ص": "الصاد", "ض": "الضاد", "ط": "الطاء", "ظ": "الظاء",
    "ع": "العين", "غ": "الغين", "ف": "الفاء", "ق": "القاف", "ك": "الكاف", "ل": "اللام", "م": "الميم", "ن": "النون", "ه": "الهاء",
    "و": "الواو", "ي": "الياء", "ا": "الألف", "ى": "الألف", "ة": "التاء المربوطة" };

  function norm(ch, marks) {
    if (ch === "آ") return "ا"; // alif + maddah, precomposed
    if ("أإؤئء".includes(ch)) return "ء";
    if (ch === "ـ") return marks.some((m) => m.t === "hamza") ? "ء" : "ـ";
    if (ch === "ے") return "ي";
    if (ch === "ٱ") return "ا";
    return ch;
  }

  function classOf(L, settings) {
    const c = (settings && settings.classes) || SETTINGS.classes;
    if (L === "ة") return "rikhw"; // read as ه at a stop
    if (c.shadid.includes(L)) return "shadid";
    if (c.bayni.includes(L)) return "bayni";
    return "rikhw";
  }
  const CLASS_WHY = { shadid: "حرف شديد (أجد قط بكت) ينحبس معه الصوت", bayni: "حرف بيني (لن عمر) يجري معه الصوت جرياناً جزئياً", rikhw: "حرف رخو يجري معه الصوت جرياناً كاملاً" };

  /** Split one word into letter units (base + its marks). */
  function parseWord(text) {
    const chars = Array.from(text);
    const units = [];
    chars.forEach((ch, i) => {
      const t = MT[ch];
      if (t && units.length) units[units.length - 1].marks.push({ i, ch, t });
      else if (!t) units.push({ b: i, ch, marks: [] });
    });
    for (const u of units) {
      u.L = norm(u.ch, u.marks);
      const has = (t) => u.marks.find((m) => m.t === t);
      u.vowelMark = u.marks.find((m) => m.t === "fatha" || m.t === "damma" || m.t === "kasra") || null;
      u.tanMark = u.marks.find((m) => /tan/.test(m.t)) || null;
      u.vowel = u.vowelMark ? VOW[u.vowelMark.t] : u.tanMark ? VOW[u.tanMark.t] : null;
      u.sukun = has("sukun") || null;
      u.shadda = has("shadda") || null;
      u.iqlab = has("iqlab") || null;
      u.madd = has("madd") || (u.ch === "آ" ? { i: u.b, ch: u.ch, t: "madd" } : null);
      u.dagger = has("dagger") || null;
      u.dot = has("dot") || has("dot2") || null;
      u.zero = has("zero") || null;
      u.waqf = has("waqf") || null;
      u.bare = !u.marks.some((m) => m.t !== "waqf" && m.t !== "sajda" && m.t !== "ctrl");
    }
    return { text, chars, units };
  }

  /** Word-internal roles: wasl alif, madd letters, silent letters, tanween carried on an alif. */
  function wordRoles(w) {
    const U = w.units;
    U.forEach((u, k) => {
      const prev = U[k - 1], next = U[k + 1];
      if (u.ch === "ٱ" || (k === 0 && u.L === "ا" && (u.dot || u.zero || (u.vowelMark && !u.sukun)))) { u.role = "wasl"; return; }
      if (u.L === "ا") {
        if (u.sukun || u.zero) { u.role = "zaid"; return; }
        if (u.tanMark || (u.iqlab && prev)) { u.role = "tanAlif"; if (prev && !prev.vowel) { prev.vowel = "a"; prev.tanOn = u; prev.bare = false; } return; }
        if (u.dot && k > 0) { u.role = "tashil"; return; }
        if (u.vowelMark) { u.role = "letter"; return; }
        if (prev && next && (next.sukun || next.shadda || (next.L === "ل" && (next.bare || next.sukun))) && !u.madd && k <= 2 && "وفبكلت".includes(prev.L)) { u.role = "silentWasl"; return; }
        if (prev && (prev.vowel === "a" || prev.dagger)) { u.role = "madd"; return; }
        if (prev && prev.L === "ء" && !prev.vowel) { u.role = "madd"; return; }
        u.role = k === 0 ? "letter" : "zaid"; return;
      }
      if (u.L === "ى" && u.tanMark) { u.role = "tanAlif"; if (prev && !prev.vowel) { prev.vowel = "a"; prev.tanOn = u; prev.bare = false; } return; }
      if ((u.L === "ى" || u.L === "ي" || u.L === "و") && u.dagger && !u.vowelMark && !u.sukun && !u.shadda) { u.role = "madd"; return; } // عَلَيٰ ، ضُحَيٰ
      if (u.L === "ى") { u.role = u.vowelMark ? "letter" : "madd"; return; }
      if (u.L === "و" && !u.vowel && !u.sukun && !u.shadda && prev && prev.vowel === "u") { u.role = "madd"; return; }
      if (u.L === "ي" && !u.vowel && !u.sukun && !u.shadda && prev && prev.vowel === "i") { u.role = "madd"; return; }
      if (u.L === "و" && u.sukun && k === 1 && prev && prev.L === "ء" && prev.vowel === "u" && next && next.L === "ل") { u.role = "zaid"; return; } // أُوْلَٰٓئِكَ
      if (u.zero) { u.role = "zaid"; return; }
      if (u.L === "ـ") { u.role = "kashida"; return; }
      u.role = "letter";
    });
    // lam of «ال» merged into a sun letter
    U.forEach((u, k) => {
      if (u.role === "letter" && u.L === "ل" && u.bare && U[k + 1] && U[k + 1].shadda && U[k - 1] && (U[k - 1].role === "wasl" || U[k - 1].role === "silentWasl")) u.role = "lamShams";
    });
    // lafz al-jalala: …ل ل ه
    const plain = U.map((u) => u.L).join("");
    const j = plain.lastIndexOf("لله");
    if (j >= 0 && /^(ء)?(و|ف|ب|ت|ل|ك)?(ا)?$/.test(plain.slice(0, j)) && U[j + 2] && U[j + 2].L === "ه" && (j + 3 === U.length || (U[j + 3].L === "م" && j + 4 === U.length))) {
      w.jalala = j + 1;
      if (U[j].bare && U[j].role === "letter") U[j].role = "lamShams";
    }
    return w;
  }

  const pronounced = (u) => u && (u.role === "letter" || u.role === "madd");

  /**
   * Analyse one ayah.
   * words: array of word texts (symbols such as ۞ allowed).
   * ctx: { settings, prevWord, nextWord, stopAtEnd, startHere }
   *   prevWord / nextWord: neighbouring word texts across the ayah boundary (wasl only).
   * Returns per word: { text, chars, units, cand: Array<Array<{cat, why, slot}>> } indexed by char.
   */
  function analyzeAyah(words, ctx) {
    ctx = ctx || {};
    const S = Object.assign({}, SETTINGS, ctx.settings || {});
    const W = words.map((t) => wordRoles(parseWord(t)));
    W.forEach((w) => (w.cand = w.chars.map(() => [])));
    const mode = S.mode;
    const n = W.length;
    // stops: word index after which the reader pauses
    const stopAfter = (wi) => {
      if (wi === n - 1) return mode !== "wasl" || ctx.stopAtEnd === true || !ctx.nextWord;
      if (mode === "marks") return W[wi].units.some((u) => u.waqf);
      return false;
    };
    const startsAt = (wi) => (wi === 0 ? mode !== "wasl" || ctx.startHere === true || !ctx.prevWord : stopAfter(wi - 1));
    const extPrev = ctx.prevWord ? wordRoles(parseWord(ctx.prevWord)) : null;
    const extNext = ctx.nextWord ? wordRoles(parseWord(ctx.nextWord)) : null;

    const add = (w, i, cat, why) => { if (i != null && w.cand[i]) w.cand[i].push({ cat, why }); };
    // the visible body of a letter: the base glyph, plus the hamza drawn as a mark on a tatweel
    const addBody = (w, u, cat, why) => { add(w, u.b, cat, why); const h = u.marks.find((m) => m.t === "hamza"); if (h) add(w, h.i, cat, why); };
    const addMark = (w, m, cat, why) => m && add(w, m.i, cat, why);

    // next pronounced unit after (wi,k), crossing into the next word only when reading continues
    function nextUnit(wi, k) {
      let w = W[wi];
      for (let kk = k + 1; kk < w.units.length; kk++) { const u = w.units[kk]; if (u.role !== "zaid" && u.role !== "kashida") return { u, sameWord: true, w }; }
      if (stopAfter(wi)) return null;
      const nw = wi + 1 < n ? W[wi + 1] : extNext;
      if (!nw) return null;
      for (const u of nw.units) if (u.role !== "zaid" && u.role !== "silentWasl" && u.role !== "wasl" && u.role !== "lamShams") return { u, sameWord: false, w: nw };
      return null;
    }
    // vowel heard right before unit k of word wi (for ra and lafz al-jalala)
    function vowelBefore(wi, k) {
      const w = W[wi];
      for (let kk = k - 1; kk >= 0; kk--) {
        const u = w.units[kk];
        if (u.role === "wasl") return { wasl: true, v: startsAt(wi) ? "a" : endVowel(wi - 1) };
        if (u.role === "silentWasl" || u.role === "lamShams" || u.role === "zaid" || u.role === "kashida") continue;
        if (u.role === "madd") return { v: u.L === "و" ? "u" : u.L === "ي" ? "i" : "a", madd: u };
        if (u.vowel) return { v: u.vowel, u };
        return { v: null, sakin: u, k: kk };
      }
      return { v: startsAt(wi) ? "a" : endVowel(wi - 1), cross: true };
    }
    function endVowel(wi) {
      const w = wi >= 0 ? W[wi] : extPrev;
      if (!w) return "a";
      for (let kk = w.units.length - 1; kk >= 0; kk--) {
        const u = w.units[kk];
        if (u.role === "zaid" || u.role === "kashida") continue;
        if (u.role === "tanAlif" || u.tanMark) return "i";
        if (u.role === "madd") return u.L === "و" ? "u" : u.L === "ي" ? "i" : "a";
        if (u.vowel) return u.vowel;
        return "i";
      }
      return "a";
    }
    function lastPronounced(w) {
      for (let kk = w.units.length - 1; kk >= 0; kk--) { const u = w.units[kk]; if (u.role !== "zaid" && u.role !== "kashida") return kk; }
      return -1;
    }

    W.forEach((w, wi) => {
      const U = w.units;
      const stopHere = stopAfter(wi);
      const lastK = lastPronounced(w);
      // ---- stop on the last letter (waqf) ----
      let waqfK = -1;
      if (stopHere && lastK >= 0) {
        const u = U[lastK];
        if (u.role === "tanAlif" || u.role === "madd") { waqfK = -2; }
        else if (u.role === "letter") waqfK = lastK;
      }

      U.forEach((u, k) => {
        const L = u.L, name = LETTER_NAME[L] || L;
        if (u.role === "wasl") { add(w, u.b, "wasl", "همزة وصل: تسقط في الوصل وتثبت عند الابتداء"); u.marks.forEach((m) => add(w, m.i, "wasl", "علامة ضبط همزة الوصل (ليست حركة تُنطق في الوصل)")); return; }
        if (u.role === "silentWasl") { add(w, u.b, "wasl", "ألف وصل لا تُنطق في الوصل"); return; }
        if (u.role === "zaid") { add(w, u.b, "zaid", "حرف يُكتب ولا يُنطق"); u.marks.forEach((m) => add(w, m.i, "zaid", "علامة على حرف لا يُنطق")); return; }
        if (u.role === "lamShams") { add(w, u.b, "lam_shamsiya", "لام مدغمة في الحرف بعدها لا تُنطق"); return; }
        if (u.role === "tashil") { add(w, u.b, "tashil", "همزة مسهّلة بين الهمزة والألف"); addMark(w, u.dot, "tashil", "علامة التسهيل"); u.marks.filter((m) => m !== u.dot).forEach((m) => VOW[m.t] && add(w, m.i, "harakat", "إتمام الحركة")); return; }

        const cls = classOf(L, S);
        const isNM = L === "ن" || L === "م";
        const prevInfo = () => vowelBefore(wi, k);

        // ---- sukun ----
        if (u.sukun && u.role !== "madd") {
          if (isNM) add(w, u.b, "ghunna_naqisa", `غنّة ناقصة في ${name} الساكنة المظهرة`);
          add(w, u.sukun.i, cls, `سكون على ${name}: ${CLASS_WHY[cls]}`);
        }
        // ---- shadda ----
        if (u.shadda) {
          if (isNM) add(w, u.shadda.i, "ghunna", `${name} مشدّدة: غنّة كاملة`);
          else if ((L === "ي" || L === "و") && precededByHiddenNun(wi, k)) add(w, u.shadda.i, "ghunna", `إدغام بغنّة في ${name}`);
          add(w, u.shadda.i, cls, `شدّة على ${name}: ${CLASS_WHY[cls]}`);
        }
        // ---- vowels and tanween ----

        let best = -1;
        for (let j = b + 1; j < nb; j++) if (j !== i && present.has(j) && MARK_RE.test(chars[j]) && (best < 0 || Math.abs(j - i) < Math.abs(best - i))) best = j;
        if (best >= 0) { owner[i] = best; continue; }
      }
      let j = i; while (j >= 0 && !present.has(j)) j--;
      owner[i] = j;
    }
    cov = new Map();
    owner.forEach((c, i) => { if (c < 0) return; if (!cov.has(c)) cov.set(c, []); cov.get(c).push(i); });
    covCache.set(text, cov);
    return cov;
  }
  /** wd = [text, advance, flat glyphs [gid, cluster, x, y, …]]; colors = category per char; range limits to chars [from, to). */
  function wordSVG(wd, colors, range) {
    if (typeof wd[0] === "number") wd = ["", wd[0], wd[1]]; // ayah-end ornament: [advance, glyphs]
    const text = wd[0], adv = wd[1], g = wd[2];
    const cov = coverage(text, g);
    let minX = range ? 1e9 : 0, maxX = range ? -1e9 : adv, uses = "";
    for (let i = 0; i < g.length; i += 4) {
      const gid = g[i], c = g[i + 1], x = g[i + 2], y = g[i + 3];
      const e = GLY[gid];
      if (!e || !e[0]) continue;
      if (range && (c < range[0] || c >= range[1])) continue;
      minX = Math.min(minX, x + e[1]); maxX = Math.max(maxX, x + e[3]);
      const cat = pickCat(colors, cov.get(c));
      uses += `<use href="#g${gid}" transform="translate(${x} ${-y}) scale(1 -1)"${cat ? ` class="k-${cat}"` : ""}/>`;
    }
    if (minX > maxX) { minX = 0; maxX = adv || 1; }
    const pad = 20, w = maxX - minX + pad * 2, h = YMAX - YMIN;
    return `<svg class="qw" viewBox="${minX - pad} ${-YMAX} ${w} ${h}" style="width:${(w / UPEM).toFixed(3)}em;height:${(h / UPEM).toFixed(3)}em" aria-hidden="true" focusable="false">${uses}</svg>`;
  }

  /* ---------------- word sheet ---------------- */

  function wordMedia(s, a, wi, text) {
    const id = STATE.videos[occKey(s, a, wi)] || STATE.videos["f:" + text];
    if (id) return { src: blobUrl(id), whole: true };
    const aid = STATE.videos[`a:${s}:${a}`], tm = STATE.timings[`a:${s}:${a}`];
    if (aid && tm && tm.length) {
      const i = tm.findIndex((x) => x[0] === wi);

  }
  function playMedia(video, m, loop) {
    if (!m) return;

    const start = () => { try { video.currentTime = m.start || 0; } catch (e) { /* not seekable yet */ } video.play().catch(() => {}); };
    if (video.readyState >= 1) start(); else video.addEventListener("loadedmetadata", start, { once: true });

  }

  }
  const ROLE_LABEL = { wasl: "همزة وصل", silentWasl: "ألف وصل لا تُنطق", zaid: "لا يُنطق", lamShams: "لام مدغمة", madd: "حرف مدّ", tanAlif: "ألف التنوين", tashil: "همزة مسهّلة" };

      const commit = await ghFetch(`${base}/git/commits`, { method: "POST", body: JSON.stringify({ message: "فيديو جديد من الشيخ", tree: tree.sha, parents: [head] }) }, g.token);
      try { await ghFetch(`${base}/git/refs/heads/${g.branch}`, { method: "PATCH", body: JSON.stringify({ sha: commit.sha }) }, g.token); return `media/${name}`; }

  // Inside Claude the page gets `window.claude`; on GitHub Pages / Cloudflare Pages it never appears (static mode).
  let STATIC = false;

    let tries = 0;

  const GH = { get() { return LS.get("gh", null); }, set(v) { LS.set("gh", v); }, clear() { LS.del("gh"); } };
  async function ghFetch(path, opts, token) {
    const r = await fetch("https://api.github.com" + path, Object.assign({}, opts || {}, {
      headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + token, "X-GitHub-Api-Version": "2022-11-28" } }));
    if (!r.ok) { const e = new Error("github " + r.status); e.status = r.status; throw e; }

  }
  async function ghLogin(repo, token) {
    const info = await ghFetch(`/repos/${repo}`, {}, token);
    if (!info.permissions || !info.permissions.push) { const e = new Error("no push"); e.status = 403; throw e; }
    GH.set({ repo, token, branch: info.default_branch || SITE.branch || "main" });
  }
  function b64utf8(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  async function ghSaveState(json) {
    const g = GH.get();
    if (!g) return false;
    const path = `/repos/${g.repo}/contents/${SITE.statePath}`;
    let sha;
    try { sha = (await ghFetch(`${path}?ref=${encodeURIComponent(g.branch)}`, {}, g.token)).sha; } catch (e) { if (e.status !== 404) throw e; }
    await ghFetch(path, { method: "PUT", body: JSON.stringify({ message: "تحديث إعدادات الشيخ", content: b64utf8(json), branch: g.branch, sha }) }, g.token);
    return true;
  }
  /** archive.org page or file link → direct file URL that a <video> can play. */
  async function resolveVideoUrl(u) {
    u = (u || "").trim();
    const m = u.match(/^https?:\/\/(?:www\.)?archive\.org\/(?:details|download)\/([^/?#]+)(?:\/([^?#]+))?/);
    if (m && m[2] && /\.(mp4|webm|m4v|mov)$/i.test(m[2])) return `https://archive.org/download/${m[1]}/${m[2]}`;
    if (m) {
      try {
        const j = await (await fetch(`https://archive.org/metadata/${m[1]}`)).json();
        const f = (j.files || []).find((x) => /\.mp4$/i.test(x.name)) || (j.files || []).find((x) => /\.webm$/i.test(x.name));
        if (f) return `https://archive.org/download/${m[1]}/${f.name.split("/").map(encodeURIComponent).join("/")}`;
      } catch (e) { /* metadata unreachable */ }
      return null;
    }
    return /^https:\/\//.test(u) ? u : null;
  }

    $("#ghIn", v).onclick = async () => {
      const repo = $("#ghRepo", v).value.trim().replace(/^https:\/\/github\.com\//, "").replace(/\/$/, ""), tok = $("#ghTok", v).value.trim();
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !tok) { toast("اكتب اسم المستودع بالشكل owner/repository والصق الرمز."); return; }
      try { await ghLogin(repo, tok); CAN_EDIT = true; $("#adminLink").hidden = false; setTopH(); toast("تمّ الدخول."); renderAdmin(); }
      catch (e) { toast(e.status === 401 ? "الرمز غير صحيح." : e.status === 403 ? "هذا الرمز لا يملك صلاحية الكتابة في المستودع." : e.status === 404 ? "لم أجد المستودع، أو الرمز لا يصل إليه." : "تعذّر الاتصال بـ GitHub.", 6000); }
    };
  }
  async function cacheWholeMushaf(btn) {
    btn.disabled = true;
    let done = 0;
    for (const s of META.surahs) {
      try { await loadSurah(s.n); done++; } catch (e) { /* keep going */ }
      if (done % 6 === 0 || done === META.surahs.length) btn.textContent = `جارٍ الحفظ… ${AR(done)} / ${AR(META.surahs.length)}`;
    }
    btn.textContent = done === META.surahs.length ? "حُفظ المصحف كاملاً على هذا الجهاز ✓" : "حُفظ جزء منه؛ أعد المحاولة عند توفّر الاتصال";
    btn.disabled = false;
  }
  function adminBackup(body) {
    body.innerHTML = `<div class="card"><h3>نسخة احتياطية</h3><p>نزّل ملفاً يحوي كل الألوان والتعديلات والملاحظات وروابط الفيديو، أو استرجع ملفاً سابقاً.</p>
      <div class="bar"><button class="btn" id="bDown">تنزيل نسخة</button><label class="btn">استرجاع من ملف<input type="file" accept="application/json,.json" id="bUp" hidden></label></div></div>`;
    $("#bDown", body).onclick = async () => {
      const d = await cap("downloads");
      if (!d) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([JSON.stringify(STATE, null, 1)], { type: "application/json" }));
        a.download = "state.json"; document.body.appendChild(a); a.click(); a.remove();
        return;
      }
      try { await d.save({ filename: "itqan-settings.json", data: JSON.stringify(STATE, null, 1) }); } catch (e) { /* declined */ }
    };
    $("#bUp", body).onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try { STATE = mergeState(JSON.parse(await f.text())); onStateChanged(); markDirty(); toast("استُرجعت النسخة. اضغط «حفظ ونشر» لاعتمادها."); } catch (err) { toast("الملف ليس نسخة صالحة."); }
    };
  }

  /* ---------------- boot ---------------- */
  async function boot() {
    readKeyLink();
    try {
      const [meta, gly, st, site] = await Promise.all([getJSON("data/meta.json"), getJSON("data/glyphs.json"), getJSON("data/state.json").catch(() => null), getJSON("data/site.json").catch(() => null)]);
      if (site) SITE = Object.assign(SITE, site);
      META = meta; GLY = gly.g; UPEM = gly.upem; YMAX = gly.yMax + 60; YMIN = gly.yMin - 60;
      if (st) STATE = mergeState(st);
    } catch (e) {
      $("#v-mushaf").innerHTML = `<div class="loading"><span>تعذّر تحميل بيانات المصحف. أعد تحميل الصفحة.</span></div>`;
      return;
    }
    refreshCats();
    buildDefs();
    window.addEventListener("hashchange", route);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && SHEET) closeSheet(); });
    $("#v-mushaf").addEventListener("click", (e) => {
      const w = e.target.closest(".w[data-wi]");
      if (w && CUR) { openWord(CUR, +w.dataset.ai, +w.dataset.wi, "mushaf"); return; }
      const ae = e.target.closest(".ae[data-ai]");
      if (ae && CUR) openAyahMenu(CUR, +ae.dataset.ai);
    });
    window.addEventListener("resize", setTopH);
    route();
    // live state for signed-in viewers
    cap("db").then(async (db) => {
      if (!db) return;
      try {
        const snap = await db.doc("shared/state").get();
        const d = snap.exists ? snap.data() : null;
        if (d && d.json && (!STATE.savedAt || String(d.savedAt) > String(STATE.savedAt))) { STATE = mergeState(JSON.parse(d.json)); onStateChanged(); }
      } catch (e) { /* read refused: keep the published file */ }
    });
    RUNTIME.then((inClaude) => {
      if (inClaude) return;
      STATIC = true;
      $("#ownerLink").hidden = false;
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
      if (GH.get()) { CAN_EDIT = true; $("#adminLink").hidden = false; setTopH(); }
      if (CAN_EDIT && LS.get("welcome", 0)) { LS.del("welcome"); toast("مرحباً بك شيخنا. تمّ تفعيل أدوات الشيخ على هذا الجهاز.", 6000); }
      const r = (location.hash || "#mushaf").slice(1);
      if (r === "admin" || r === "about" || (CAN_EDIT && (r === "mushaf" || !ROUTES.includes(r)))) route();
    });
    cap("user").then(async (u) => {
      if (!u) return;
      try { CAN_EDIT = await u.canEdit(); } catch (e) { CAN_EDIT = false; }
      if (CAN_EDIT) {
        $("#adminLink").hidden = false; setTopH();
        const draft = LS.get("draft", null);
        if (draft) { try { const d = JSON.parse(draft); if (!STATE.savedAt || d.savedAt > STATE.savedAt) { STATE = mergeState(d); DIRTY = true; onStateChanged(); toast("استُرجعت تعديلات لم تُنشر بعد من هذا المتصفح."); } } catch (e) { /* ignore */ } }
        if ((location.hash || "").slice(1) === "admin") renderAdmin();
        if (SHEET) drawSheet();
      }
    });
  }
  boot();
})();
</script>
</body>
</html>
